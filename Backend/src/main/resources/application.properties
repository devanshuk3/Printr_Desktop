# Server Configuration
server.port=${PORT:5000}

# Database Configuration - Uses Supabase Transaction Pooler (port 6543)
# Transaction mode supports far more concurrent connections than Session mode (port 5432)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.jduoonbxrlmifpctncnl}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Yadav@5467890}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool - Lean config for Supabase Transaction Pooler
# Supavisor pools on their end, so keep this low to avoid hitting the 60 conn limit
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=PrintrHikariPool

# JPA/Hibernate - Tuned for Supabase transaction-mode pooling
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Required for transaction-mode pooler — prevents "prepared statement already exists" errors
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=false

# Cloudflare R2 (S3-compatible) Properties
r2.bucket-name=${R2_BUCKET_NAME:}
r2.endpoint=${R2_ENDPOINT:}
r2.access-key=${R2_ACCESS_KEY_ID:}
r2.secret-key=${R2_SECRET_ACCESS_KEY:}

# Server optimization - compression & Tomcat tuning for high throughput
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=100
server.tomcat.max-connections=200

# Logging - Production levels
logging.level.root=WARN
logging.level.com.printr=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=INFO
