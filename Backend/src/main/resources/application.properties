# Server Configuration
server.port=${PORT:5000}

# Database Configuration (DatabaseConfig.java will override this on Render)
# Local fallback (from .env)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cloudflare R2 (S3-compatible) Properties - Matching Render
r2.bucket-name=${R2_BUCKET_NAME:}
r2.endpoint=${R2_ENDPOINT:}
r2.access-key=${R2_ACCESS_KEY_ID:}
r2.secret-key=${R2_SECRET_ACCESS_KEY:}

# Security
spring.security.user.name=admin
spring.security.user.password=admin-password

# Logging
logging.level.org.springframework.web=INFO

# JPA view set to false
spring.jpa.open-in-view=false

