# Server Configuration
server.port=${PORT:5000}

# Database Configuration - Uses Supabase Transaction Pooler (port 6543)
# Transaction mode supports far more concurrent connections than Session mode (port 5432)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.jduoonbxrlmifpctncnl}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Yadav@5467890}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool - Production settings for ~1000 users
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=PrintrHikariPool

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Cloudflare R2 (S3-compatible) Properties
r2.bucket-name=${R2_BUCKET_NAME:}
r2.endpoint=${R2_ENDPOINT:}
r2.access-key=${R2_ACCESS_KEY_ID:}
r2.secret-key=${R2_SECRET_ACCESS_KEY:}

# Logging - Production levels
logging.level.root=WARN
logging.level.com.printr=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=INFO
