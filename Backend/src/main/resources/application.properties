# Server Configuration
server.port=${PORT:5000}

# Database Configuration
spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.jduoonbxrlmifpctncnl
spring.datasource.password=Yadav@5467890
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool - limit to avoid exhausting Supabase pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cloudflare R2 (S3-compatible) Properties - Matching Render
r2.bucket-name=${R2_BUCKET_NAME:}
r2.endpoint=${R2_ENDPOINT:}
r2.access-key=${R2_ACCESS_KEY_ID:}
r2.secret-key=${R2_SECRET_ACCESS_KEY:}

# Security
spring.security.user.name=admin
spring.security.user.password=admin-password

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.printr=DEBUG

# JPA view set to false
spring.jpa.open-in-view=false

